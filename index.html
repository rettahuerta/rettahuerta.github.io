<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retta Huerta</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 600px;
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 6px;
            background-color: #161b22;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .links a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            width: 80%;
            max-width: 300px;
            background-color: #0d1117;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .links a:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Retta Huerta</h1>
    <div class="subtitle">Data & Patterns</div>
    <p>Central identity node. Processing systemic structures across culture, physics, and metaphysics.</p>
    
    <div class="links">
        <a href="https://currentinstance.com">Current Instance (Book Project)</a>
        <a href="https://github.com" target="_blank">GitHub Profile</a>
    </div>
</div>

</body>
</html>
