<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retta Huerta</title>
    <style>
        body {
            background-color: #05070a;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 600px;
            border: 1px solid #21262d;
            padding: 50px 40px;
            border-radius: 12px;
            background-color: #0d1117;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            margin-bottom: 5px;
            letter-spacing: -1px;
            transition: text-shadow 0.3s ease, color 0.3s ease;
        }
        h1:hover {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.4);
        }
        .subtitle {
            font-size: 0.95rem;
            color: #8b949e;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #afb8c1;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid #21262d;
            padding: 14px 24px;
            border-radius: 8px;
            width: 85%;
            max-width: 320px;
            background-color: #05070a;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        .links a:hover {
            color: #00f0ff;
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
            background-color: #0d1117;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Retta Huerta</h1>
    <div class="subtitle">Data & Patterns</div>
    <p>Central identity node. Processing systemic structures across culture, physics, and metaphysics.</p>
    
    <div class="links">
        <a href="https://currentinstance.com">Current Instance (Book Project)</a>
        <a href="https://github.com" target="_blank">GitHub Profile</a>
    </div>
</div>

</body>
</html>
